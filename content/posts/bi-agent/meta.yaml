excerpt: 一个企业内部 BI 平台的设计与实现：看板与语义声明收敛为 postgres 中的可校验声明，用户一句话进入 ReAct 循环，AI 编辑助手把意图编译成可校验的语义树，Linter 作为质量底线。本文按「运行时、语义树契约、错误回流、SQL 安全代理、语义层、数据流」六个子系统展开关键实现。
